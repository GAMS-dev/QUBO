[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamspy_qubo"
version = "0.1.0"
description = "A GAMSPy implemention of classic GAMS-QUBO reformulation."
authors = [
  { name = "GAMS Development Corporation", email = "support@gams.com" },
]
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
  "gamspy >= 1.11.0"
]

[project.optional-dependencies]
test = [
  "pytest >= 8.4.1",
]
dwave = [
  "dwave-ocean-sdk",
]

[project.urls]
repository = "https://github.com/GAMS-dev/qubo"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.ruff.format]
line-ending = "cr-lf"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=2.2.2.240807",
    "pre-commit>=4.3.0",
    "ruff>=0.14.14",
    "types-pygments>=2.19.0.20251121",
    "types-requests>=2.32.4.20260107",
]
